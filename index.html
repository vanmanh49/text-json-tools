<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text &amp; JSON Tools</title>
  <meta name="description" content="Free in-browser tools: format JSON with colours and folding, decode JWTs, Base64 and URL encode/decode, unescape text to JSON, escape JSON to text, minify JSON, and compare and merge text. Nothing leaves your browser.">

  <link rel="preload" href="/fonts/ibm-plex-sans-latin-400.woff2" as="font" type="font/woff2" crossorigin>

  <script>
    // Apply the saved theme before first paint so the page doesn't flash the wrong colours.
    try { const t = localStorage.getItem('tjt:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  </script>
